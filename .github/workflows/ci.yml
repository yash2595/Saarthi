name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mongodb:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deployment/requirements-test.txt
      - name: Install test dependencies
        run: python -m pip install -r "final backend mantrasetu/mantrasetu-saarthi-backend-main/app/requirements.txt" -r deployment/requirements-test.txt
      - name: Isolated backend HTTP and security contracts
        working-directory: final backend mantrasetu/mantrasetu-saarthi-backend-main
        run: python -m pytest tests/test_security_contract.py -q --tb=short
      - name: AI navigation, voice providers and WebSocket contracts
        run: python deployment/run_ai_checks.py
      - name: Deployment and missing-configuration checks
        run: python -m pytest deployment/test_startup.py -q --tb=short

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: final frontend mantrasetu/MantraSetu-Saarthi-main
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: final frontend mantrasetu/MantraSetu-Saarthi-main/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=moderate
